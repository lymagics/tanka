name: tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        uses: lymagics/aka-midori@v0.0.2
        with:
          install: uv sync --locked
          test: make unit
      - name: Deep tests
        run: make deep
